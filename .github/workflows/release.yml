name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest # Apple Silicon (M1+) runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare notary API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID code signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization is done explicitly AFTER the build (see "Notarize and
          # staple DMG" step). Tauri's built-in notary wait hangs in CI, so we
          # only let it SIGN here and notarize visibly with notarytool below.

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Locate DMG
        id: dmg
        run: |
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: No .dmg found"
            find src-tauri/target -name "*.dmg" -o -name "*.app" 2>/dev/null || true
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_PATH")
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG_PATH"

      - name: Notarize and staple DMG
        run: |
          DMG="${{ steps.dmg.outputs.path }}"
          echo "Submitting $DMG to Apple notary (live status below)..."
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "${{ secrets.APPLE_API_KEY }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER }}" \
            --wait
          echo "Stapling notarization ticket onto the DMG..."
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Locate updater artifacts
        id: updater
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          # The updater .tar.gz and .sig live under macos/
          TAR_PATH=$(find "$BUNDLE_DIR/macos" -name "*.tar.gz" 2>/dev/null | head -1)
          SIG_PATH=$(find "$BUNDLE_DIR/macos" -name "*.tar.gz.sig" 2>/dev/null | head -1)
          LATEST_PATH=$(find "$BUNDLE_DIR" -name "latest.json" 2>/dev/null | head -1)
          echo "tar_path=${TAR_PATH}" >> "$GITHUB_OUTPUT"
          echo "sig_path=${SIG_PATH}" >> "$GITHUB_OUTPUT"
          echo "latest_path=${LATEST_PATH}" >> "$GITHUB_OUTPUT"
          echo "Found updater artifacts: tar=$TAR_PATH sig=$SIG_PATH latest=$LATEST_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kasset ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.updater.outputs.tar_path }}
            ${{ steps.updater.outputs.sig_path }}
            ${{ steps.updater.outputs.latest_path }}
