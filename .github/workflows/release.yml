name: Release

# A release is a v* tag pushed by the owner (the tag ruleset allows no one else); a failed run is re-run from Actions.
on:
  push:
    tags:
      - "v*"

# Nothing by default; the release job asks for what it needs.
permissions: {}

jobs:
  build-macos:
    # Only this repo, started by its owner: a fork or anyone else never reaches the signing steps.
    if: github.repository == 'pareekshithbompally/roci' && github.actor == 'pareekshithbompally'
    runs-on: macos-latest # Apple Silicon (M1+) runner
    environment: release # deploys only from v* tags
    permissions:
      contents: write # create the release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        # Xcode 26: macOS 26 SDK, and actool that compiles AppIcon.icon (older ones skip it).
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "ERROR: no Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare notary API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build on-device engine (llama-server)
        # llama.cpp's server for on-device chat, meeting search and voices; Tauri bundles it.
        run: scripts/build-llama-server.sh

      - name: Build Tauri app
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID code signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization is done explicitly AFTER the build (see "Notarize and
          # staple DMG" step). Tauri's built-in notary wait hangs in CI, so we
          # only let it SIGN here and notarize visibly with notarytool below.

      - name: Verify app icon (Icon Composer, light, dark and tinted)
        run: |
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)"
          test -f "$APP/Contents/Resources/Assets.car" || { echo "ERROR: AppIcon.icon was not compiled (Assets.car missing)"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP/Contents/Info.plist"

      - name: Verify App Intents (Spotlight, Siri and Shortcuts actions)
        run: |
          APP="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)"
          test -f "$APP/Contents/Resources/Metadata.appintents/extract.actionsdata" || { echo "ERROR: Metadata.appintents missing"; exit 1; }
          strings -a "$APP/Contents/MacOS/Roci" | grep -qx "RociIntents" || { echo "ERROR: the intents are not linked into Roci"; exit 1; }

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Locate DMG
        id: dmg
        run: |
          DMG_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "ERROR: No .dmg found"
            find src-tauri/target -name "*.dmg" -o -name "*.app" 2>/dev/null || true
            exit 1
          fi
          DMG_NAME=$(basename "$DMG_PATH")
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG_PATH"

      - name: Notarize and staple DMG
        env:
          DMG: ${{ steps.dmg.outputs.path }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Submitting $DMG to Apple notary (live status below)..."
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          echo "Stapling notarization ticket onto the DMG..."
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Locate updater artifacts and generate latest.json
        id: updater
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          TAR_PATH=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" 2>/dev/null | head -1)
          SIG_PATH=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz.sig" 2>/dev/null | head -1)
          if [ -z "$TAR_PATH" ] || [ -z "$SIG_PATH" ]; then
            echo "ERROR: updater artifacts missing (tar=$TAR_PATH sig=$SIG_PATH)"
            exit 1
          fi
          VERSION="${TAG#v}"
          TAR_NAME=$(basename "$TAR_PATH")
          # tauri build does NOT emit latest.json — generate the updater manifest here
          jq -n \
            --arg version "$VERSION" \
            --arg pubdate "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$SIG_PATH")" \
            --arg url "https://github.com/pareekshithbompally/roci/releases/download/$TAG/$TAR_NAME" \
            '{version:$version, notes:("Roci "+$version), pub_date:$pubdate, platforms:{"darwin-aarch64":{signature:$sig, url:$url}}}' \
            > latest.json
          echo "Generated latest.json:"; cat latest.json
          echo "tar_path=$TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "sig_path=$SIG_PATH" >> "$GITHUB_OUTPUT"
          echo "latest_path=$PWD/latest.json" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Roci ${{ steps.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.updater.outputs.tar_path }}
            ${{ steps.updater.outputs.sig_path }}
            ${{ steps.updater.outputs.latest_path }}
