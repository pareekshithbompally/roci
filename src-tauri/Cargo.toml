[package]
name = "Roci"
version = "1.13.4"
description = "Private meeting notes and AI chat for Mac, iPhone and iPad."
authors = ["Pareekshith Bompally"]
license = "MIT"
repository = "https://github.com/pareekshithbompally/roci"
edition = "2024"
rust-version = "1.91"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
apple-build = { path = "plugins/apple-build" }
cc = "1"
serde_json = "1.0"

# Shared by every Apple target (macOS, iOS, iPadOS).
[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# protocol-asset: chat shows the images tools save under app data (scope in tauri.conf.json: images only).
tauri = { version = "2.12", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
# `unsafe-headers`: lets the webview send an empty Origin, which the plugin then drops (src/services/platform-fetch.ts),
# so servers never apply browser CORS rules to this native client. Roci sets no other restricted header.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# Web links in the default browser.
tauri-plugin-opener = "2"
# Meetings, chats, settings and RAG (SQLite + sqlite-vec).
tauri-plugin-store = { path = "plugins/tauri-plugin-store" }
# On-device model (Foundation Models) and speech (SpeechAnalyzer).
tauri-plugin-apple-intelligence = { path = "plugins/tauri-plugin-apple-intelligence" }
# Calendar + Reminders (EventKit) and local notifications (UserNotifications).
tauri-plugin-calendar = { path = "plugins/tauri-plugin-calendar" }
tauri-plugin-notifications = { path = "plugins/tauri-plugin-notifications" }
# On-device model downloads (catalog files from Hugging Face, resumable, SHA-256 checked) on every platform.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
sha2 = "0.10"
# On-device speech: transcription (transcribe.cpp, ggml on Metal; Roci's copy via [patch.crates-io] below) and read aloud
# (system voices via AVSpeechSynthesis, on-device voices' samples as base64, played through cpal at the device's rate);
# hound reads the WAVs transcription takes.
transcribe-cpp = "=0.4.2"
# Chat, search and read aloud on device: llama.cpp built on transcribe.cpp's ggml (engines/llama-sys).
roci-llama-sys = { path = "engines/llama-sys" }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis", "AVAudioSession", "AVAudioSessionTypes", "AVAudioApplication", "block2"] }
cpal = "0.18.2"
rubato = "5.0.1"
base64 = "0.22"
# MCP client (remote servers over Streamable HTTP) on every platform; the Mac adds launched servers below.
rmcp = { version = "3.10.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
hound = "3.5.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
# Meeting recording on every platform (the audio core; iPhone's audio session and microphone consent).
block2 = "0.6.2"
# The device's network path (Network framework's monitor runs on its own dispatch queue).
dispatch2 = "0.3.1"
eyre = "0.6.12"
tracing = { version = "0.1.44", features = ["log"] }

# iPhone and iPad only: haptics (UIKit's feedback generators; the Mac has none for apps to play).
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-haptics = "2"

# macOS only, until each piece is made shared (docs: platform/apple-platforms/code-organization.md, R2).
[target.'cfg(target_os = "macos")'.dependencies]
# Hex's folder (FSEvents): its launch, quit and Labs changes wake the meeting watcher instead of a retry timer.
notify = "8"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-apple-notes = { path = "plugins/tauri-plugin-apple-notes" }
status-menu = { path = "plugins/status-menu" }
tauri-plugin-core-spotlight = { path = "plugins/tauri-plugin-core-spotlight" }
core-graphics = "0.24"
core-foundation = "0.10"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# roci:// URL actions (Shortcuts, Raycast, Alfred, links in notes)
tauri-plugin-deep-link = "2"
libc = "0.2.189"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
# MCP client: launched (stdio) servers run only on the Mac.
rmcp = { version = "3.10.0", features = ["transport-child-process"] }
# Coding agents: read Codex's config.toml to show whether Roci is registered.
toml = "0.9"
# Call detection (which app holds the microphone) and app icons.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSRunningApplication",
  # App icons (Finder, …) rendered to PNG: NSWorkspace → NSImage → NSBitmapImageRep.
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
  # pid_t APIs (runningApplicationWithProcessIdentifier, processIdentifier).
  "libc",
] }

# transcribe.cpp builds from Roci's own copy (engines/transcribe.cpp/ROCI.md): upstream plus Roci's two patches.
[patch.crates-io]
transcribe-cpp = { path = "engines/transcribe.cpp/bindings/rust/transcribe-cpp" }
transcribe-cpp-sys = { path = "engines/transcribe.cpp" }


# macOS keeps every dev build's object files for their debug info and, since Rust 1.88, never reuses them
# (rust-lang/rust#161824): packed debug info lets them go; line tables keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Build-time crates (proc macros, build scripts) keep their symbols: stripping them makes rustc fail to load
# macro crates on Rust 1.93 / macOS 27 ("can't find crate for `zerofrom_derive`"). The app binary is still stripped.
[profile.release.build-override]
strip = false

[dev-dependencies]
ts-rs = "11"
