[package]
name = "Kasset"
version = "1.0.0"
description = "AI-powered voice capture, transcription, and insights"
authors = ["Kasset.ai"]
license = "MIT"
repository = "https://github.com/pareekshithbompally/kasset-ai"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
hound = "3.5"
screencapturekit = { version = "1.5", features = ["macos_15_0"] }
cpal = "0.15"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-llamacpp = { path = "plugins/tauri-plugin-llamacpp" }
tauri-plugin-vectordb = { path = "plugins/tauri-plugin-vectordb" }
core-graphics = "0.24"
core-foundation = "0.10"
base64 = "0.22"
tauri-plugin-window-state = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
