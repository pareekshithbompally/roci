[package]
name = "Kasset"
version = "1.2.0"
description = "AI-powered voice capture, transcription, and insights"
authors = ["Pareekshith Bompally"]
license = "MIT"
repository = "https://github.com/pareekshithbompally/kasset-ai"
edition = "2024"
rust-version = "1.91"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
cc = "1"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
# `unsafe-headers`: lets the webview send an empty Origin, which the plugin then drops (src/services/platform-fetch.ts),
# so servers never apply browser CORS rules to this native client. Kasset sets no other restricted header.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-store = { path = "plugins/tauri-plugin-store" }
tauri-plugin-calendar = { path = "plugins/tauri-plugin-calendar" }
tauri-plugin-notifications = { path = "plugins/tauri-plugin-notifications" }
tauri-plugin-apple-intelligence = { path = "plugins/tauri-plugin-apple-intelligence" }
tauri-plugin-apple-notes = { path = "plugins/tauri-plugin-apple-notes" }
status-menu = { path = "plugins/status-menu" }
tauri-plugin-core-spotlight = { path = "plugins/tauri-plugin-core-spotlight" }
core-graphics = "0.24"
core-foundation = "0.10"
base64 = "0.22"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# kasset:// URL actions (Shortcuts, Raycast, Alfred, links in notes)
tauri-plugin-deep-link = "2"
block2 = "0.6.2"
cpal = "0.18.2"
eyre = "0.6.12"
hound = "3.5.1"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
rubato = "5.0.1"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
tracing = { version = "0.1.44", features = ["log"] }
# MCP client: stdio child-process + Streamable HTTP transports.
rmcp = { version = "3.10.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt", "net", "fs"] }
# Coding agents: read Codex's config.toml to show whether Kasset is registered.
toml = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# On-device speech-to-text (ggml, Metal). Pinned with [patch.crates-io] below.
transcribe-cpp = "=0.4.1"
sha2 = "0.10"
# Read aloud: Phonon TTS on CPU (Accelerate + KleidiAI for Q8 weights); `hf` = the tokenizer.
ptts = { version = "=0.7.1", features = ["hf", "accelerate", "kai"] }
# Read aloud: the macOS system voices (names, quality, novelty flag) for the voice picker.
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis"] }
# Call detection (which app holds the microphone) and app icons.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSRunningApplication",
  # App icons (Finder, …) rendered to PNG: NSWorkspace → NSImage → NSBitmapImageRep.
  "NSWorkspace",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
  # pid_t APIs (runningApplicationWithProcessIdentifier, processIdentifier).
  "libc",
] }

# transcribe-cpp fork revision: Parakeet vocabulary rescoring and a Metal residency fix.
[patch.crates-io]
transcribe-cpp = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "2778ae4bf5ca5f394d129a39467f4ad9552dc34f" }
transcribe-cpp-sys = { git = "https://github.com/anomalyco/transcribe.cpp", rev = "2778ae4bf5ca5f394d129a39467f4ad9552dc34f" }

# Phonon is hot numeric code: always fully optimized, even in dev and the size-optimized release.
[profile.dev.package.ptts]
opt-level = 3
[profile.dev.package.xn]
opt-level = 3
[profile.release.package.ptts]
opt-level = 3
[profile.release.package.xn]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Build-time crates (proc macros, build scripts) keep their symbols: stripping them makes rustc fail to load
# macro crates on Rust 1.93 / macOS 27 ("can't find crate for `zerofrom_derive`"). The app binary is still stripped.
[profile.release.build-override]
strip = false
