[package]
name = "Kasset"
version = "1.0.8"
description = "AI-powered voice capture, transcription, and insights"
authors = ["Kasset.ai"]
license = "MIT"
repository = "https://github.com/pareekshithbompally/kasset-ai"
edition = "2024"
rust-version = "1.91"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-store = { path = "plugins/tauri-plugin-store" }
tauri-plugin-calendar = { path = "plugins/tauri-plugin-calendar" }
core-graphics = "0.24"
core-foundation = "0.10"
base64 = "0.22"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
mac-notification-sys = "0.6"
block2 = "0.6.2"
cpal = "0.18.2"
eyre = "0.6.12"
hound = "3.5.1"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
rubato = "5.0.1"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
tracing = { version = "0.1.44", features = ["log"] }
# MCP client (ported from Jan, Apache-2.0): stdio child-process + Streamable HTTP transports.
rmcp = { version = "3.10.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
