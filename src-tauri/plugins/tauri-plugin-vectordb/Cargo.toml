[package]
name = "tauri-plugin-vectordb"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for local vector search using sqlite-vec"
links = "tauri-plugin-vectordb"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.9.5" }
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
sqlite-vec = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
