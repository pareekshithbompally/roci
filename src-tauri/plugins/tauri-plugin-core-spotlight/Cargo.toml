[package]
name = "tauri-plugin-core-spotlight"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for macOS Spotlight via Core Spotlight"
links = "tauri-plugin-core-spotlight"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
