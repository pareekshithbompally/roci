[package]
name = "tauri-plugin-llamacpp"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for managing llama.cpp server processes"
links = "tauri-plugin-llamacpp"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["net", "time", "process", "io-util", "fs", "rt"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
zip = "2"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
