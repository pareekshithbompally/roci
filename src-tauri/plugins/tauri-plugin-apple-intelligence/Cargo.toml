[package]
name = "tauri-plugin-apple-intelligence"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for Apple's on-device models: FoundationModels (chat, summaries) and SpeechAnalyzer (transcription)"
links = "tauri-plugin-apple-intelligence"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
apple-build = { path = "../apple-build" }

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
