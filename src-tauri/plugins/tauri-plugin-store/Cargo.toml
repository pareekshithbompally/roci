[package]
name = "tauri-plugin-store"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for unified SQLite storage (sqlite-vec, FTS5, knowledge graph)"
links = "tauri-plugin-store"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.9.5" }
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
sqlite-vec = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
security-framework = "3.7"
log = "0.4"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
ts-rs = "11"
