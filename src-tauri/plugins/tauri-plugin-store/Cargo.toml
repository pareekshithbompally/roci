[package]
name = "tauri-plugin-store"
version = "0.1.0"
edition = "2021"
description = "Tauri plugin for unified SQLite storage (FTS5 and sqlite-vec hybrid search, knowledge graph via GraphQLite)"
links = "tauri-plugin-store"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
cc = "1"

[dependencies]
tauri = { version = "2.9.5" }
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
# Its header, for compiling GraphQLite against the same SQLite (build.rs): the version rusqlite 0.31 uses.
libsqlite3-sys = "0.28"
sqlite-vec = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
sha2 = "0.10"
# API keys: AES-256-GCM on disk, its key one Keychain item ("Roci Safe Storage", Chromium's safe storage design).
aes-gcm = "0.10"
base64 = "0.22"
security-framework = "3.7"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
ts-rs = "11"
