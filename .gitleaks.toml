# gitleaks' built-in rules, plus provider-style API keys and long random tokens whatever the variable is called
# (the built-in generic rule needs a name like "key" or "token" next to it).
[extend]
useDefault = true

[[rules]]
id = "provider-api-key"
description = "An AI or developer-platform API key by its prefix"
regex = '''\b(?:sk-(?:proj-|ant-|or-v1-)?|gsk_|xai-|pplx-|hf_|ghp_|gho_|github_pat_|AIza|dg_|sk_|el_)[A-Za-z0-9_\-]{20,}'''
entropy = 3.5
keywords = ["sk-", "gsk_", "xai-", "pplx-", "hf_", "ghp_", "gho_", "github_pat_", "aiza", "dg_", "sk_", "el_"]

[[rules]]
id = "high-entropy-token"
description = "A long random string in quotes (base64 or hex secret material)"
regex = '''["'`]([A-Za-z0-9+/_\-]{40,}={0,2})["'`]'''
secretGroup = 1
entropy = 4.5
[[rules.allowlists]]
description = "Content hashes and pinned commits, not secrets"
regexes = [
  '''^[0-9a-f]{40}$''', '''^[0-9a-f]{64}$''', '''^sha(256|384|512)-''',
  # the updater's public key ("untrusted comment: minisign public key"), meant to ship in the app
  '''^dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk''',
  # images inlined as base64 (PNG)
  '''^iVBORw0KGgo''',
]
paths = ['''package-lock\.json''', '''Cargo\.lock''', '''Package\.resolved''', '''\.pbxproj$''']

[allowlist]
# llama.cpp's upstream source is vendored unchanged; its examples, test data and hash code match the generic rules.
description = "Fake keys used by tests, and llama.cpp's vendored upstream source"
paths = ['''^tests/''', '''^src-tauri/engines/llama\.cpp/''']
