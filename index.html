<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Roci</title>
    <!-- Tokens + splash load with the page, not the JS bundle, so the first frame is themed (src/app/splash.ts) -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/splash.css" />
    <script>
      // Synchronous theme init — runs BEFORE CSS paints to prevent light flash
      (function() {
        var theme = localStorage.getItem('theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.add('light');
      })();
    </script>
  </head>
  <body class="text-primary antialiased overflow-hidden" id="app-body">
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <!-- Roci mark: the app icon's folded hull, monochrome -->
      <svg viewBox="0 0 18 18" fill="currentColor">
        <path d="M8.33 2.38 Q8.54 1.93 8.54 2.43 L8.54 12.80 Q8.54 13.20 8.19 13.38 L2.13 16.40 Q1.32 16.80 1.71 15.99 Z"/><path d="M9.46 2.43 Q9.46 1.93 9.67 2.38 L16.29 15.99 Q16.68 16.80 15.87 16.40 L9.81 13.38 Q9.46 13.20 9.46 12.80 Z"/>
      </svg>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
